# Pinned Terraform toolchain for this consumer repo.
#
# Source your bootstrap .env first so the secrets/endpoints are in the shell:
#   source ../bootstrap-container/.env
#   docker compose run --rm terraform init
#   docker compose run --rm terraform plan
#   docker compose run --rm terraform apply
#
# Mappings below adapt the bootstrap PROXMOX_* / TFC_TOKEN env to the names the
# tfe and bpg/proxmox providers expect.
services:
  terraform:
    build: .
    working_dir: /workspace/vernify/terraform-dev01-deploy
    volumes:
      - /Users/wernervandermerwe/workspace:/workspace
    environment:
      - TF_IN_AUTOMATION=1
      # TFC cloud backend auth
      - TF_TOKEN_app_terraform_io=${TFC_TOKEN:-}
      - TFE_TOKEN=${TFC_TOKEN:-}
      # Telmate/proxmox provider auth (username/password)
      - TF_VAR_proxmox_api_url=https://pve08.vernify.com:8006/api2/json
      - TF_VAR_proxmox_user=${PROXMOX_USER:-root@pam}
      - TF_VAR_proxmox_password=${PROXMOX_PASSWORD:-}
      # Proxmox node for the VM
      - TF_VAR_proxmox_node=${PROXMOX_NODE:-pve08}
    entrypoint: ["terraform"]
